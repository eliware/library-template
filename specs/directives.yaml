version: "12.0"
description: Local requirements for the Eliware library template.
directives:
  - id: E-100.0
    dos:
      - Provide a native ESM library template with a sample API, types,
        documentation, examples, and release guidance.
      - Replace template identity, sample API, and package metadata when creating a derived library.
    donts:
      - Do not publish template identity, sample API, or placeholder metadata as a finished library.
